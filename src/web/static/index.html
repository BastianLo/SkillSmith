<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>skillsmith</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vendor/uplot.min.css">
</head>
<body>
  <header class="topbar">
    <button class="btn ghost icon menu-btn" id="menu-btn" type="button" aria-label="Menü"></button>
    <a class="brand" href="#/" id="brand">skillsmith</a>
    <span class="scope" id="scope"></span>
    <span class="top-flags" id="flags"></span>
    <div class="top-actions">
      <form class="quicksearch" id="quicksearch" role="search">
        <input type="search" class="input sm" id="quicksearch-input" placeholder="Suchen …" aria-label="Suchen" autocomplete="off">
      </form>
      <button class="btn sm" id="palette-btn" type="button" title="Befehlspalette (Strg+K)">Befehle <kbd>Strg K</kbd></button>
      <button class="btn sm" id="note-btn" type="button" title="Schnellnotiz (N)">Notiz</button>
      <span class="live-dot" id="live-dot" title="Live-Aktualisierung"></span>
    </div>
  </header>
  <nav class="side" id="side" aria-label="Navigation"></nav>
  <nav class="subnav" id="subnav" aria-label="Seiten dieses Bereichs"></nav>
  <main id="view" tabindex="-1"></main>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="sr-only" id="announce" aria-live="assertive"></div>
  <script src="vendor/d3-force.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
